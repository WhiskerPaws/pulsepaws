<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhiskerPaws Dashboard</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        .btn-active:active { transform: scale(0.96); }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-zinc-900">

    <!-- Auth Guard Layer -->
    <div id="login-overlay" class="fixed inset-0 bg-zinc-950 z-50 flex flex-col items-center justify-center p-6 transition-opacity duration-300">
        <div class="w-full max-w-sm bg-zinc-900 border border-zinc-800 rounded-3xl p-6 shadow-2xl text-center">
            <div class="w-20 h-20 bg-amber-500/10 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-amber-500/20">
                <span class="text-4xl text-amber-500">🐾</span>
            </div>
            <h1 class="text-2xl font-bold tracking-tight mb-1">WhiskerPaws</h1>
            <p class="text-sm text-zinc-400 mb-6">Open your passive earnings wallet</p>
            
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Email Address</label>
                    <input type="email" id="login-email" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-amber-500" placeholder="moneypaws.app.help@gmail.com">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Password</label>
                    <input type="password" id="login-password" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-amber-500" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full btn-active bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold py-3 rounded-xl text-sm transition-all mt-2 cursor-pointer">
                    Log In
                </button>
            </form>
        </div>
    </div>
    <!-- Main Mobile Layout Window -->
    <main class="w-full max-w-md mx-auto p-4 space-y-4 pb-28">
        
        <!-- Header Profile Balance Component -->
        <header class="bg-zinc-900 border border-zinc-800 rounded-3xl p-5 flex items-center justify-between shadow-xl">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-zinc-800 rounded-xl flex items-center justify-center border border-zinc-700">
                    <span class="text-xl">🐾</span>
                </div>
                <div>
                    <h2 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Total Balance</h2>
                    <div class="flex items-baseline gap-1">
                        <span id="balance-display" class="text-2xl font-black text-amber-500 tracking-tight">0</span>
                        <span class="text-xs font-bold text-zinc-500 uppercase">Coins</span>
                    </div>
                </div>
            </div>
            <button onclick="handleLogout()" class="text-xs font-semibold text-zinc-500 hover:text-zinc-300 border border-zinc-800 bg-zinc-950/50 px-3 py-1.5 rounded-lg cursor-pointer">
                Sign Out
            </button>
        </header>

        <!-- Dynamic Feature Grid -->
        <section class="grid grid-cols-2 gap-3">
            <button onclick="triggerRewardedAd('dashboard_main')" class="btn-active text-left bg-zinc-900 border border-zinc-800 rounded-2xl p-4 flex flex-col justify-between aspect-square cursor-pointer">
                <div class="w-10 h-10 bg-emerald-500/10 text-emerald-400 rounded-xl flex items-center justify-center text-xl">🎬</div>
                <div>
                    <h3 class="font-bold text-sm">Watch Ads</h3>
                    <p class="text-xs text-zinc-400 mt-0.5">+20 Coins</p>
                </div>
            </button>

            <button onclick="addExpense()" class="btn-active text-left bg-zinc-900 border border-zinc-800 rounded-2xl p-4 flex flex-col justify-between aspect-square cursor-pointer">
                <div class="w-10 h-10 bg-blue-500/10 text-blue-400 rounded-xl flex items-center justify-center text-xl">📊</div>
                <div>
                    <h3 class="font-bold text-sm">Add Expense</h3>
                    <p class="text-xs text-zinc-400 mt-0.5">+2 Coins</p>
                </div>
            </button>
        </section>

        <!-- Lucky Spin Wheel Module -->
        <section class="bg-zinc-900 border border-zinc-800 rounded-3xl p-5 shadow-xl text-center space-y-3">
            <div class="flex items-center justify-between text-left">
                <div class="flex items-center gap-2">
                    <span class="text-lg">🎡</span>
                    <h3 class="font-bold text-sm">Lucky Spin Wheel</h3>
                </div>
                <span id="spin-limit-display" class="text-xs bg-zinc-950 px-2 py-0.5 rounded-md border border-zinc-800 text-amber-500">5/5</span>
            </div>
            <div class="bg-zinc-950 rounded-2xl p-4 border border-zinc-850">
                <div id="spin-feedback" class="text-xs text-zinc-400 min-h-[16px]">Test your luck for grand rewards!</div>
            </div>
            <button onclick="spinWheel()" class="w-full btn-active bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold py-3 rounded-xl text-sm cursor-pointer shadow-md">
                Spin Wheel
            </button>
        </section>

        <!-- Walking Tracker Milestone Component -->
        <section class="bg-zinc-900 border border-zinc-800 rounded-3xl p-5 shadow-xl space-y-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="text-lg">🏃</span>
                    <h3 class="font-bold text-sm">Walking Pedometer</h3>
                </div>
                <span class="text-[10px] text-zinc-400 uppercase tracking-widest">100 Steps = 1 Coin</span>
            </div>
            <div class="bg-zinc-950 p-4 rounded-2xl border border-zinc-850 flex items-center justify-between">
                <div>
                    <p class="text-xs text-zinc-500">Unclaimed Step Buffer</p>
                    <p class="text-xl font-black text-zinc-200"><span id="step-display">0</span> / 100</p>
                </div>
                <button onclick="simulateWalk()" class="btn-active bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 px-4 py-2 rounded-xl text-xs font-bold cursor-pointer">
                    Walk 🐾
                </button>
            </div>
        </section>
        <!-- Automated Video Reward Chest -->
        <section class="bg-zinc-900 border border-zinc-800 rounded-3xl p-5 shadow-xl flex items-center justify-between">
            <div class="space-y-0.5">
                <h3 class="font-bold text-sm flex items-center gap-2">🎁 Timed Chest</h3>
                <p id="video-feedback" class="text-xs text-zinc-500">Check if your 3-hour bonus is ready</p>
            </div>
            <button onclick="checkVideoAdCooldown()" class="btn-active bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-bold px-4 py-2.5 rounded-xl text-xs cursor-pointer shadow-md">
                Open Chest
            </button>
        </section>

        <!-- Daily Tasks Checklist -->
        <section class="bg-zinc-900 border border-zinc-800 rounded-3xl p-5 shadow-xl space-y-3">
            <h3 class="font-bold text-sm flex items-center gap-2">🗹 Daily Quests</h3>
            <label class="flex items-center justify-between p-3 bg-zinc-950/60 rounded-xl border border-zinc-850 cursor-pointer">
                <div class="flex items-center gap-3">
                    <input type="checkbox" onchange="completeTask(this, 15)" class="w-4 h-4 accent-amber-500">
                    <span class="text-xs text-zinc-300">Complete profiling registration</span>
                </div>
                <span class="text-xs font-bold text-zinc-500">+15</span>
            </label>
        </section>

    </main>

    <!-- Navigation Footer Layout -->
    <nav class="fixed bottom-0 left-0 right-0 bg-zinc-900/90 backdrop-blur-md border-t border-zinc-800 py-3 z-40">
        <div class="max-w-md mx-auto flex justify-around items-center px-6">
            <button class="flex flex-col items-center gap-1 text-amber-500 cursor-pointer">
                <span class="text-xl">🏠</span>
                <span class="text-[10px] font-bold uppercase tracking-wider">Home</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-zinc-500 cursor-pointer">
                <span class="text-xl">💰</span>
                <span class="text-[10px] font-bold uppercase tracking-wider">Cashout</span>
            </button>
        </div>
    </nav>

    <!-- Core App Interface Handlers -->
    <script>
        function handleLogin(event) {
            event.preventDefault();
            localStorage.setItem('paws_auth_session', 'active');
            document.getElementById('login-overlay').classList.add('opacity-0', 'pointer-events-none');
        }

        function handleLogout() {
            localStorage.removeItem('paws_auth_session');
            document.getElementById('login-overlay').classList.remove('opacity-0', 'pointer-events-none');
        }

        document.addEventListener("DOMContentLoaded", function() {
            if (localStorage.getItem('paws_auth_session') === 'active') {
                document.getElementById('login-overlay').classList.add('opacity-0', 'pointer-events-none');
            }
        });
    </script>
    <script src="app.js"></script>
</body>
</html>
