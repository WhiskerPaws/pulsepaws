name: Build WhiskerPaws Android Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Initialize Web Directory Deployment
        run: |
          mkdir -p public
          cp index.html public/
          cp app.js public/
          npm install

      - name: Inject Android Platform Dependencies
        run: |
          npx cap init WhiskerPaws com.mycompany.whiskerpaws --web-dir=public || true
          npx cap add android || true
          npx cap sync android

      - name: Resolve Duplicate Kotlin Dependency Clashes
        run: |
          if [ -d "android" ]; then
            echo "configurations.all {
                resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                    if (details.requested.group == 'org.jetbrains.kotlin') {
                        details.useVersion '1.9.20'
                    }
                }
            }" >> android/build.gradle
          fi

      - name: Setup Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Compile Standalone Android APK
        run: |
          if [ -d "android" ]; then
            cd android && ./gradlew assembleDebug
          else
            echo "Android directory fallback template initialization"
            npx cap add android
            cd android && ./gradlew assembleDebug
          fi

      - name: Archive Production APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhiskerPaws-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
