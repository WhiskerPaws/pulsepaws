name: Build WhiskerPaws Android Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-level: '20'

      - name: Install Mobile Wrapper Tools
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli
          npm install @capacitor/android
          npx cap init WhiskerPaws com.mycompany.whiskerpaws --web-dir=.

      - name: Inject Android Platform Dependencies
        run: |
          npx cap add android
          npx cap sync android

      - name: Setup Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Compile Standalone Android APK
        run: |
          cd android && ./gradlew assembleDebug

      - name: Archive Production APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhiskerPaws-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
