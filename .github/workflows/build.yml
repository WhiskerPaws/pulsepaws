name: Check signing secrets
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Test keystore and passwords
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
          SP: ${{ secrets.KEYSTORE_PASSWORD }}
          KP: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KS ALIAS SP KP; do
            [ -n "${!v}" ] || { echo "FAIL: secret for $v is empty or missing"; exit 1; }
          done
          if printf '%s' "$KS" | grep -q '[[:space:]"]'; then
            echo "WARNING: KEYSTORE_BASE64 contains spaces, quotes or line breaks. Re-paste it as one clean line."
          fi
          printf '%s' "$KS" | tr -d '[:space:]"' | base64 -d > ks.jks || { echo "FAIL: KEYSTORE_BASE64 is not valid base64"; exit 1; }
          echo "Decoded keystore size: $(wc -c < ks.jks) bytes"
          keytool -list -keystore ks.jks -storepass "$SP" -alias "$ALIAS" \
            || { echo "FAIL: cannot open the keystore or find alias. Check KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS."; exit 1; }
          echo "test" > t.txt && jar cf t.jar t.txt
          jarsigner -keystore ks.jks -storepass "$SP" -keypass "$KP" t.jar "$ALIAS" \
            || { echo "FAIL: signing failed. Check KEY_PASSWORD."; exit 1; }
          echo "ALL GOOD: your signing secrets work. You can run the release build."
