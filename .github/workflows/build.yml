name: Build signed release (AAB for Play Store)
on:
  workflow_dispatch:

env:
  # Replace with your real AdMob app id before publishing.
  ADMOB_APP_ID: ca-app-pub-3940256099942544~3347511713

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Add AdMob app id to manifest
        run: |
          sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"/>\n    </application>#" android/app/src/main/AndroidManifest.xml
      - name: Bump version code
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - run: npx cap sync android
      - name: Build release bundle
        working-directory: android
        run: ./gradlew bundleRelease
      - name: Sign bundle
        id: sign
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: handy-aab
          path: ${{ steps.sign.outputs.signedReleaseFile }}
