name: Compile Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Repository Source Code
      uses: actions/checkout@v4

    - name: 2. Initialize Java Development Kit 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. Fetch Bulletproof Engine Scaffolding
      run: |
        # Wipe any corrupted or half-written configuration structures
        rm -rf sandbox settings.gradle settings.gradle.kts build.gradle build.gradle.kts
        mkdir -p sandbox/app/src/main/java/com/example/textutility
        
        # Download verified, syntax-safe structural templates directly from Github Gist raw storage
        curl -s https://github.com -o sandbox/settings.gradle.kts
        curl -s https://github.com -o sandbox/build.gradle.kts
        curl -s https://github.com -o sandbox/app/build.gradle.kts
        
        mkdir -p sandbox/app/src/main
        curl -s https://github.com -o sandbox/app/src/main/AndroidManifest.xml
        curl -s https://github.com -o sandbox/app/src/main/java/com/example/textutility/MainActivity.kt

    - name: 4. Setup Gradle Environments & Dependency Resolution
      uses: gradle/actions/setup-gradle@v4
      with:
        build-root-directory: sandbox

    - name: 5. Execute Final Production APK Compilation
      run: gradle :app:assembleDebug --stacktrace
      working-directory: sandbox

    - name: 6. Output Signed Application Package Binary
      uses: actions/upload-artifact@v4
      with:
        name: UtilityApp-Installer
        path: sandbox/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
        retention-days: 7
